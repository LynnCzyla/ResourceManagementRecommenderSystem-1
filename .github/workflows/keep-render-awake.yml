name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (Render sleeps after 15 mins idle)
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging backend at $(date)"
          curl -sSf "${{ secrets.RENDER_BACKEND_URL }}/api/health" || echo "Ping failed, but continuing"
